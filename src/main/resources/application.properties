spring.application.name=financeiro-api
spring.profiles.default=prod
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

security.client-id=${CLIENT_ID}
security.client-secret=${CLIENT_SECRET}

# Duracao do token em segundos.
jwt.duration=${JWT_DURATION}
jwt.issuer=${JWT_ISSUER}
# Chave RSA privada em formato JWK, obrigatoria fora do profile dev.
jwt.jwk=${JWT_JWK:}

# Origens permitidas, separadas por virgula.
cors.origins=${CORS_ORIGINS}
